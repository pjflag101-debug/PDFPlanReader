[project]
name = "ramconcept-ai"
version = "0.1.0"
description = "AI assistant for reading RAM Concept engineering PDFs"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ramread = "ramconcept_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
