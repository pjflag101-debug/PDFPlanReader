[project]
name = "pdf-plan-reader"
version = "0.1.0"
description = "PDF-first structural design plan reader"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdfplan = "pdf_plan_reader.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
